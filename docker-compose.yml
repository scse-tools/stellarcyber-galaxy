# Stellar Cyber Galaxy — run anywhere with: docker compose up -d --build
services:
  galaxy:
    build: .
    image: stellar-cyber-galaxy:latest
    container_name: stellar-cyber-galaxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    # GALAXY_ENCRYPTION_KEY comes from .env (see README). Generate it before first run.
    env_file:
      - .env
    environment:
      # Absolute DB path inside the container, on the mounted volume below.
      GALAXY_DB_PATH: /app/data/galaxy.db
      # Uncomment only if this host reaches the internet through an HTTP proxy:
      # NODE_USE_ENV_PROXY: "1"
      # HTTPS_PROXY: http://proxy.internal:3128
    volumes:
      # Persists the encrypted SQLite database (and your configured instances)
      # on the host. Your existing ./data is reused as-is.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
