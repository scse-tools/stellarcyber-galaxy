# Stellar Cyber Galaxy — run anywhere with: docker compose up -d --build
# Serves HTTPS on :3000 with a self-signed certificate generated on first run
# (browsers will warn about the self-signed cert until you install your own in Global settings).
services:
  galaxy:
    build: .
    image: stellar-cyber-galaxy:latest
    container_name: stellar-cyber-galaxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    # GALAXY_ENCRYPTION_KEY comes from .env (see README). Generate it before first run.
    env_file:
      - .env
    environment:
      GALAXY_DB_PATH: /app/data/galaxy.db
      GALAXY_TLS_DIR: /app/data/tls
      # Uncomment only if this host reaches the internet through an HTTP proxy:
      # NODE_USE_ENV_PROXY: "1"
      # HTTPS_PROXY: http://proxy.internal:3128
    volumes:
      # Persists the encrypted database, TLS certificate, and configured instances on the host.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0';fetch('https://127.0.0.1:3000/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
